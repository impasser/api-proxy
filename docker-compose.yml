version: '3.8'

services:
  api-proxy:
    build: .
    container_name: api-proxy
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # 🎯 目標上游端點：在同一 vnet 下，可直接填 newapi 的容器名稱 (例如 http://newapi:3000)
      - TARGET_URL=https://your-api-endpoint.com
      - ALLOWED_DOMAIN=
      - MODEL_ALIASES=
      - DEBUG_LOG=false
      - ENABLE_TOOLS=true
      - ENABLE_PROMPT_CACHE_OPTIONS=false
      - ENABLE_TRUNCATION=false
      - ENABLE_TOP_LEVEL_REASONING_EFFORT=false
      - ENABLE_TOP_P=false
    networks:
      - vnet

# 連接到本地已存在的 vnet 虛擬網路
networks:
  vnet:
    name: ${DOCKER_NETWORK:-vnet}
    external: true
